<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyMini 테스트 클라이언트</title>
<style>
body{font-family:system-ui,'Noto Sans KR',sans-serif;margin:0;background:#eef0f6;color:#161a2b}
.w{max-width:900px;margin:0 auto;padding:16px;display:grid;gap:10px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,button,textarea{font:inherit;padding:7px 10px;border:1px solid #cfd3e2;border-radius:8px;background:#fff}
button{cursor:pointer}button.p{background:#161a2b;color:#fff}
#feed{height:56vh;overflow:auto;background:#fff;border:1px solid #dfe2ed;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;padding:8px 11px;border-radius:12px;background:#f3f4f9;white-space:pre-wrap;overflow-wrap:anywhere}
.m.mini{border:1px dashed #4338ca;background:#efeefc}.m.me{align-self:flex-end;background:#e3e6f5}
.m.sys{align-self:center;background:#e9ebf3;font-size:12.5px;color:#666c85}
.m.tool{border-left:3px solid #0b7a6e;background:#e8f6f3}.m.res,.m.digest{align-self:center;border:1px solid #cfd3e2;background:#fff;max-width:90%}
.w small{color:#666c85}#orch{font:12px ui-monospace,monospace;color:#444}
</style></head><body><div class="w">
<div class="bar"><b>MyMini</b>
<label>방 <input id="room" value="demo" size="8"></label>
<label>나 <select id="user"><option value="jongwon">종원</option><option value="minsu">민수</option><option value="jihyun">지현</option></select></label>
<button id="conn" class="p">입장</button><button id="away">자리 비움</button><button id="end">회의 종료·정리</button><small id="st"></small></div>
<div id="members"><small></small></div>
<div id="feed"></div><div id="orch"></div>
<div class="bar"><select id="mode"><option value="direct">직접 말하기</option><option value="delegate">미니미에게 맡기기</option></select>
<input id="text" style="flex:1;min-width:200px" placeholder="안건이나 의견 (Enter)"><button id="send" class="p">보내기</button></div>
</div>
<script>
let ws,me,away=false,names={};
const $=id=>document.getElementById(id), feed=$('feed');
function add(cls,t){const d=document.createElement('div');d.className='m '+cls;d.textContent=t;feed.appendChild(d);feed.scrollTop=feed.scrollHeight}
function render(m){
  const n=names[m.user_id]||m.user_id;
  if(m.kind==='human')add(m.user_id===me?'me':'',n+': '+m.text);
  else if(m.kind==='mini')add('mini',n+' 미니미'+(m.proxy?' [대리]':'')+': '+m.text);
  else if(m.kind==='tool')add('tool','검색: '+(m.meta.query||'')+'\n'+m.text);
  else if(m.kind==='result'){const x=m.meta;add('res','[회의 결과]\n안건: '+x.agenda+'\n주요 의견: '+(x.opinions||[]).join(' / ')+'\n충돌: '+(x.conflicts||[]).join(' / ')+'\n결론: '+x.conclusion)}
  else if(m.kind==='digest')add('digest','[부재 요약 · '+m.meta.count+'개]\n'+m.text);
  else add('sys',m.text);
}
$('conn').onclick=()=>{
  if(ws)ws.close(); me=$('user').value; feed.innerHTML='';
  const proto=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(`${proto}://${location.host}/ws/${$('room').value}/${me}`);
  ws.onopen=()=>$('st').textContent='연결됨';ws.onclose=()=>$('st').textContent='끊김';
  ws.onmessage=e=>{const d=JSON.parse(e.data);
    if(d.type==='history')d.messages.forEach(render);
    else if(d.type==='message')render(d);
    else if(d.type==='presence'){d.members.forEach(m=>names[m.user_id]=m.name);
      $('members').innerHTML='<small>'+d.members.map(m=>m.name+(m.online?' (접속)':'')+(m.away?' (자리비움)':'')).join(' · ')+'</small>'}
    else if(d.type==='orchestrator')$('orch').textContent='라운드 '+d.round+' | '+Object.entries(d.scores).map(([k,v])=>(names[k]||k)+' '+v).join(', ')+' → '+(d.pick?(names[d.pick]||d.pick):'발언 없음')+' (임계 '+d.threshold+') '+d.why;
    else if(d.type==='typing')$('orch').textContent=(names[d.user_id]||d.user_id)+' 미니미가 생각 중...';
  };
};
function send(){const t=$('text').value.trim();if(!t||!ws)return;ws.send(JSON.stringify({type:'message',text:t,mode:$('mode').value}));$('text').value=''}
$('send').onclick=send;$('text').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing)send()});
$('away').onclick=()=>{away=!away;ws&&ws.send(JSON.stringify({type:'away',value:away}));$('away').textContent=away?'돌아옴':'자리 비움'};
$('end').onclick=()=>ws&&ws.send(JSON.stringify({type:'end_meeting'}));
</script></body></html>
