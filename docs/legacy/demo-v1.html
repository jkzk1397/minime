<title>MyMini 회의방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: 3-column meeting room. Left = people + minis, center = chat, right = orchestrator + activity log. */
:root{
  --bg:#eef0f6; --surface:#ffffff; --surface2:#f6f7fb; --ink:#161a2b; --muted:#666c85; --line:#dfe2ed;
  --jw:#4338ca; --jw-soft:#e6e5fb; --ms:#b4430f; --ms-soft:#fbe9db; --jh:#0b7a6e; --jh-soft:#d9f2ee;
  --sys:#e9ebf3; --ok:#15803d; --warn:#b45309; --accent:#161a2b; --accent-ink:#ffffff;
  --font:'IBM Plex Sans KR',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1220; --surface:#171b2e; --surface2:#1d2238; --ink:#e9ebf6; --muted:#9aa1bd; --line:#2a3050;
  --jw:#a5a0ff; --jw-soft:#26265a; --ms:#ffa774; --ms-soft:#4a2a17; --jh:#5fd6c4; --jh-soft:#12403b;
  --sys:#222844; --ok:#4ade80; --warn:#fbbf24; --accent:#e9ebf6; --accent-ink:#0f1220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1220; --surface:#171b2e; --surface2:#1d2238; --ink:#e9ebf6; --muted:#9aa1bd; --line:#2a3050;
  --jw:#a5a0ff; --jw-soft:#26265a; --ms:#ffa774; --ms-soft:#4a2a17; --jh:#5fd6c4; --jh-soft:#12403b;
  --sys:#222844; --ok:#4ade80; --warn:#fbbf24; --accent:#e9ebf6; --accent-ink:#0f1220; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;padding-inline:16px}
.wrap{max-width:1320px;margin:0 auto;padding-block:16px;display:flex;flex-direction:column;gap:12px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--jw);outline-offset:2px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:20px;margin:0;letter-spacing:-.02em}
.brand span{color:var(--muted);font-size:13px}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-weight:500}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{opacity:.9;background:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 10px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.stepper{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.step{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);font-size:12px;white-space:nowrap}
.step i{font-style:normal;font-family:var(--mono);font-size:11px}
.step.done{color:var(--ink)}
.step.done i{color:var(--ok)}
.step.now{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:250px minmax(0,1fr) 300px;gap:12px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.panel h2{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0;padding:12px 14px 8px;font-family:var(--mono)}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.person{padding:10px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.pair{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;position:relative}
.av.mini{border-radius:10px;background:var(--surface2)!important;border:1.5px dashed currentColor;font-size:13px}
.av .dot{position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid var(--surface)}
.av .dot.away{background:var(--warn)}
.pname{font-weight:600;line-height:1.2}
.prole{font-size:12px;color:var(--muted)}
.pair .grow{flex:1;min-width:0}
.tag{font-family:var(--mono);font-size:10.5px;padding:2px 6px;border-radius:5px;background:var(--sys);color:var(--muted);white-space:nowrap}
.tag.proxy{background:var(--warn);color:#fff}
.mini-row{display:flex;align-items:center;gap:10px;padding-left:44px;font-size:13px}
.persona{padding:0 0 0 44px;display:none;flex-direction:column;gap:6px}
.persona.open{display:flex}
.persona label{font-size:11px;color:var(--muted);font-family:var(--mono)}
.persona textarea{width:100%;resize:vertical;min-height:44px;font:inherit;font-size:12.5px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--ink)}
.mem{margin:0;padding-left:16px;font-size:12px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);font-size:12px;text-decoration:underline;text-underline-offset:3px}
.chat{display:flex;flex-direction:column;overflow:hidden}
.chat-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.chat-head b{font-size:15px}
.chat-head small{color:var(--muted)}
.feed{height:min(66vh,640px);min-height:380px;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.msg{display:flex;gap:10px;max-width:100%;animation:in .25s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.msg{animation:none}.dots span{animation:none!important}}
.bubble{min-width:0;max-width:min(560px,100%)}
.who{font-size:12px;color:var(--muted);margin-bottom:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.who b{color:var(--ink);font-weight:600}
.txt{padding:9px 12px;border-radius:4px 14px 14px 14px;background:var(--surface2);border:1px solid var(--line);overflow-wrap:anywhere;white-space:pre-wrap}
.msg.human .txt{background:var(--surface);border:1.5px solid var(--c)}
.msg.mini .txt{background:var(--soft);border:1px dashed var(--c)}
.msg.me{flex-direction:row-reverse;margin-left:auto}
.msg.me .txt{border-radius:14px 4px 14px 14px}
.msg.me .who{justify-content:flex-end}
.sys{align-self:center;background:var(--sys);color:var(--muted);font-size:12.5px;padding:5px 12px;border-radius:999px;text-align:center;max-width:100%;overflow-wrap:anywhere}
.chip{font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:8px;max-width:620px;width:100%;align-self:center;animation:in .25s ease both}
.card h3{margin:0;font-size:13px;font-family:var(--mono);letter-spacing:.04em;color:var(--muted);font-weight:500}
.card p{margin:0}
.card .k{font-size:12px;color:var(--muted);font-family:var(--mono);margin-top:4px}
.card ul{margin:0;padding-left:18px}
.toolcard{border-left:3px solid var(--jh)}
.res h4{margin:0;font-size:16px}
.final{display:flex;align-items:center;gap:8px;padding-top:8px;border-top:1px solid var(--line);font-weight:600}
.pending{color:var(--warn)}
.okc{color:var(--ok)}
.typing{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12.5px}
.dots{display:inline-flex;gap:3px}
.dots span{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
.composer{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.composer .row{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;resize:none;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);min-height:42px;max-height:120px}
.hint{font-size:12px;color:var(--muted)}
.score{display:flex;flex-direction:column;gap:7px;padding:4px 14px 12px}
.srow{display:grid;grid-template-columns:62px 1fr 34px 42px;gap:8px;align-items:center;font-size:12.5px}
.bar{height:8px;border-radius:4px;background:var(--sys);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--c);transition:width .5s ease}
.srow .n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.srow .st{font-family:var(--mono);font-size:10.5px;text-align:center;padding:1px 0;border-radius:4px;background:var(--sys);color:var(--muted)}
.srow .st.go{background:var(--ok);color:#fff}
.why{padding:0 14px 14px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.log{list-style:none;margin:0;padding:0 14px 14px;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto;font-size:12.5px}
.log li{display:grid;grid-template-columns:44px 1fr;gap:8px;color:var(--muted)}
.log li time{font-family:var(--mono);font-size:11px}
.log li b{color:var(--ink);font-weight:500}
.api{padding:10px 14px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
@media (max-width:1060px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .side.left{order:2}.chat{order:1}.side.right{order:3}
  .feed{height:60vh}
}
@media (max-width:520px){
  .srow{grid-template-columns:54px 1fr 30px 38px}
  .persona,.mini-row{padding-left:0}
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>MyMini</h1><span>내가 회의에 못 가도, 내 미니미는 회의에 간다</span></div>
    <div class="ctrls">
      <button class="btn primary" id="play" type="button">데모 재생</button>
      <button class="btn" id="next" type="button">다음 장면</button>
      <button class="btn" id="reset" type="button">처음부터</button>
      <div class="seg" role="group" aria-label="재생 속도">
        <button type="button" data-speed="1.6" aria-pressed="false">느리게</button>
        <button type="button" data-speed="1" aria-pressed="true">보통</button>
        <button type="button" data-speed="0.5" aria-pressed="false">빠르게</button>
      </div>
    </div>
  </header>

  <nav class="stepper" id="stepper" aria-label="데모 진행 단계"></nav>

  <div class="grid">
    <aside class="side left">
      <section class="panel" aria-labelledby="h-people">
        <h2 id="h-people">참여자 · 미니미</h2>
        <div id="people"></div>
      </section>
    </aside>

    <section class="panel chat" aria-label="회의방">
      <div class="chat-head">
        <div><b>AI 해커톤 팀방</b> <small id="roomsub">사람 3 · 미니미 3</small></div>
        <small id="aiSrc"></small>
      </div>
      <div class="feed" id="feed" role="log" aria-live="polite"></div>
      <div class="composer">
        <div class="row" style="justify-content:space-between;flex-wrap:wrap">
          <div class="seg" role="group" aria-label="발언 방식">
            <button type="button" id="mDirect" aria-pressed="true">종원이 직접 말하기</button>
            <button type="button" id="mDeleg" aria-pressed="false">종원 미니미에게 맡기기</button>
          </div>
          <span class="hint" id="modeHint">메시지를 보내면 미니미들이 관련도에 따라 반응합니다.</span>
        </div>
        <div class="row">
          <textarea id="input" rows="1" placeholder="안건이나 한 줄 의견을 입력하세요. 예: 가격은 무료로 가자"></textarea>
          <button class="btn primary" id="send" type="button">보내기</button>
        </div>
      </div>
    </section>

    <aside class="side right">
      <section class="panel" aria-labelledby="h-orch">
        <h2 id="h-orch">오케스트레이터 판단</h2>
        <div class="score" id="score"></div>
        <div class="why" id="why">새 메시지가 올라오면 누가 반응할지 점수로 보여줍니다.</div>
      </section>
      <section class="panel" aria-labelledby="h-log">
        <h2 id="h-log">AI 활동 기록</h2>
        <ul class="log" id="log"></ul>
        <div class="api">데모용 화면입니다. 실제 제품에서는 FastAPI + WebSocket 서버가 메시지를 받고, 오케스트레이터가 LLM과 검색 도구를 호출합니다.</div>
      </section>
    </aside>
  </div>
</div>

<script>
(function(){
'use strict';
var P = {
  jw:{id:'jw',name:'종원',role:'기획 · PM',init:'종',c:'--jw',soft:'--jw-soft',
      tone:'짧고 편한 말투. "~하자", "~어때?"로 끝낸다.',
      traits:'개발보다 기획 선호. 사용자 경험 중시. 구현 가능성도 같이 따진다.',
      mem:['지난 회의: 데모는 한 장면에 집중하자고 주장','선호: 짧은 결론, 핵심 기능 우선']},
  ms:{id:'ms',name:'민수',role:'백엔드 개발',init:'민',c:'--ms',soft:'--ms-soft',

      mem:['지난 회의: 3일 안에 되는지 먼저 확인하자고 함','선호: 근거 있는 일정, 작은 범위']},
  jh:{id:'jh',name:'지현',role:'UI/UX 디자인',init:'현',c:'--jh',soft:'--jh-soft',

};
var ORDER=['jw','ms','jh'];
var STEPS=['가입','미니미 생성','채팅방 생성','입장','안건 입력','의견 교환','자리 비움','대리 참여','자료조사','결론','복귀','확인'];
var AGENDA='AI 미니미 서비스를 해커톤 주제로 사용할 것인가?';

/* scripted demo scenario (steps follow the MVP flow) */
var SCRIPT=[
 {t:'human',who:'jw',step:5,text:'이번 해커톤 주제로 MyMini 어때? 내 미니미가 대신 회의에 들어가는 거.',log:'종원이 안건을 올림'},
 {t:'mini',who:'jh',step:6,text:'UX로 보면 "내 미니미가 대신 말해준다"가 한눈에 이해돼서 데모 임팩트 있을 듯!',
  o:{jw:.22,ms:.58,jh:.86},why:'UX와 데모 임팩트 언급 → 지현의 성향(첫인상 중시)과 일치. 가장 높은 점수라 먼저 발언.'},
 {t:'mini',who:'ms',step:6,text:'취지는 좋은데 범위가 걱정이야. 실시간 채팅 + 에이전트 + 검색을 3일 안에 다 되나?',
  o:{jw:.31,ms:.91,jh:.40},why:'구현 가능성 질문이 나옴 → 민수의 개발 일정 우려와 일치. 의견 충돌 가능성이 있어 응답.'},
 {t:'mini',who:'jw',step:6,text:'종원이는 데모 장면 하나에 집중하는 쪽이야. 사람 3 + 미니미 3으로 줄이면 어때?',
  o:{jw:.84,ms:.35,jh:.44},why:'범위 논쟁이 안건 방향과 직결 → 종원 미니미가 종원의 기준(핵심 기능 우선)으로 정리.'},
 {t:'human',who:'ms',step:7,text:'나 수업 때문에 먼저 감. 이어서 해줘.',log:'민수가 자리 비움 선언',away:'ms'},
 {t:'sys',step:7,text:'민수가 자리를 비웠습니다. 민수 미니미가 대리 참여합니다.'},
 {t:'mini',who:'ms',step:8,proxy:true,text:'민수가 자리를 비웠어. 지금까지 민수가 한 말(일정 걱정, 범위 축소 선호)을 기준으로 대신 이야기할게.',
  o:{jw:.2,ms:.95,jh:.2},why:'민수가 부재 중 → 민수 미니미 점수에 +0.3 가산. 대리 참여를 먼저 알림.'},
 {t:'mini',who:'jh',step:8,text:'그럼 로그인은 빼고 채팅방은 하나로 고정하면 구현량이 많이 줄지 않을까?',
  o:{jw:.28,ms:.52,jh:.88},why:'범위 축소 아이디어가 필요한 타이밍 → 화면 설계 관점의 지현이 제안.'},
 {t:'mini',who:'ms',step:8,proxy:true,text:'좋아. 근데 FastAPI에서 WebSocket이 바로 되는지 확인이 필요해. 자료 찾아볼게.',
  o:{jw:.18,ms:.93,jh:.25},why:'기술 검증 필요 → 민수 영역. 검색 에이전트 호출을 요청.'},
 {t:'tool',step:9,q:'FastAPI WebSocket 지원 여부',a:'FastAPI는 @app.websocket 데코레이터로 WebSocket 엔드포인트를 기본 제공합니다. 별도 라이브러리 없이 구현할 수 있습니다.',src:'fastapi.tiangolo.com/advanced/websockets',log:'검색 에이전트 실행'},
 {t:'mini',who:'ms',step:9,proxy:true,text:'확인했어. 기본 지원이라 하루면 붙일 수 있을 듯. 민수 기준으론 이 정도면 OK야.',
  o:{jw:.15,ms:.9,jh:.2},why:'검색 결과가 도착 → 근거를 본 민수 미니미가 의견을 수정(우려 → 동의).'},
 {t:'mini',who:'jh',step:9,text:'그럼 UI는 내가 채팅 화면이랑 미니미 상태 표시부터 잡을게.',
  o:{jw:.3,ms:.2,jh:.8},why:'합의 후 역할 분담 단계 → 지현이 작업 범위를 선언.'},
 {t:'mini',who:'jw',step:10,text:'정리할게. 사람 3 + 미니미 3, 채팅방 하나, 자리 비움 대리 참여가 핵심 시연이야. 이렇게 결론 내자.',
  o:{jw:.89,ms:.22,jh:.3},why:'세 의견이 수렴 → 안건 담당자(종원) 미니미가 결론을 제안.'},
 {t:'result',step:10,log:'회의 결과 자동 정리'},
 {t:'return',step:11,who:'ms',log:'민수 복귀, 부재 요약 생성',away:'back'},
 {t:'human',who:'ms',step:12,text:'아 이 정도면 괜찮음. 그대로 가자.',log:'민수가 결과 확인 후 동의',final:true}
];

var S={msgs:[],away:{jw:false,ms:false,jh:false},idx:0,run:false,busy:false,speed:1,mode:'direct',tok:0,step:4,awayStart:null,sample:undefined,custom:{}};
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function clock(){var d=new Date();return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}

/* ---------- rendering: people ---------- */
function renderPeople(){
  var h='';
  ORDER.forEach(function(id){
    var p=P[id],away=S.away[id];
    var cust=S.custom[id]||{};
    h+='<div class="person" data-p="'+id+'">'+
     '<div class="pair"><div class="av" style="background:var('+p.c+')">'+p.init+'<span class="dot'+(away?' away':'')+'"></span></div>'+
     '<div class="grow"><div class="pname">'+p.name+'</div><div class="prole">'+p.role+'</div></div>'+
     '<button class="btn" type="button" data-away="'+id+'" style="padding:4px 9px;font-size:12px" aria-pressed="'+away+'">'+(away?'돌아옴':'자리 비움')+'</button></div>'+
     '<div class="mini-row" style="color:var('+p.c+')"><div class="av mini" style="color:var('+p.c+')">AI</div>'+
     '<span style="color:var(--ink)">'+p.name+' 미니미</span> '+(away?'<span class="tag proxy">대리 참여</span>':'<span class="tag">대기</span>')+'</div>'+
     '<div><button class="linkbtn" type="button" data-persona="'+id+'" style="margin-left:44px">페르소나 보기·수정</button></div>'+
     '<div class="persona" id="pers-'+id+'">'+
       '<label for="tone-'+id+'">말투</label><textarea id="tone-'+id+'" data-f="tone" data-id="'+id+'">'+esc(cust.tone||p.tone)+'</textarea>'+
       '<label for="trait-'+id+'">성향</label><textarea id="trait-'+id+'" data-f="traits" data-id="'+id+'">'+esc(cust.traits||p.traits)+'</textarea>'+
       '<label>장기 기억</label><ul class="mem">'+p.mem.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul>'+
     '</div></div>';
  });
  var el=$('people');
  var open={};ORDER.forEach(function(id){var e=$('pers-'+id);open[id]=e&&e.classList.contains('open')});
  el.innerHTML=h;
  ORDER.forEach(function(id){if(open[id])$('pers-'+id).classList.add('open')});
}
$('people').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.persona){$('pers-'+b.dataset.persona).classList.toggle('open')}
  if(b.dataset.away){toggleAway(b.dataset.away)}
});
$('people').addEventListener('input',function(e){
  var t=e.target;if(!t.dataset.f)return;
  S.custom[t.dataset.id]=S.custom[t.dataset.id]||{};S.custom[t.dataset.id][t.dataset.f]=t.value;
});
function toggleAway(id){
  if(S.run||S.busy)return;
  S.away[id]=!S.away[id];
  if(S.away[id]){S.awayStart=S.msgs.length}
  sys(S.away[id]?P[id].name+'이(가) 자리를 비웠습니다. '+P[id].name+' 미니미가 대리 참여합니다.':P[id].name+'이(가) 돌아왔습니다.');
  addLog(S.away[id]?P[id].name+' 자리 비움, 대리 참여 시작':P[id].name+' 복귀');
  renderPeople();
}

/* ---------- stepper ---------- */
function renderStepper(){
  $('stepper').innerHTML=STEPS.map(function(n,i){
    var k=i+1,c=k<S.step?'done':(k===S.step?'now':'');
    return '<div class="step '+c+'"><i>'+(k<S.step?'완료':k)+'</i>'+n+'</div>';
  }).join('');
  var now=$('stepper').querySelector('.now');
  if(now&&now.scrollIntoView){var st=$('stepper');var l=now.offsetLeft-st.clientWidth/2+now.clientWidth/2;st.scrollTo({left:Math.max(0,l),behavior:'smooth'})}
}

/* ---------- feed ---------- */
var feed=$('feed');
function scroll(){feed.scrollTop=feed.scrollHeight}
function sys(t){var d=document.createElement('div');d.className='sys';d.textContent=t;feed.appendChild(d);scroll()}
function msgHTML(m){
  var p=P[m.who];
  var me=m.who==='jw'&&m.kind==='human';
  var cls='msg '+m.kind+(me?' me':'');
  var av=m.kind==='mini'?'<div class="av mini" style="color:var('+p.c+')">AI</div>':'<div class="av" style="background:var('+p.c+')">'+p.init+'</div>';
  var who='<b>'+p.name+(m.kind==='mini'?' 미니미':'')+'</b>';
  if(m.proxy)who+='<span class="tag proxy">대리 참여</span>';
  if(m.chip)who+='<span class="chip">'+esc(m.chip)+'</span>';
  who+='<span>'+m.time+'</span>';
  return '<div class="'+cls+'" style="--c:var('+p.c+');--soft:var('+p.soft+')">'+av+'<div class="bubble"><div class="who">'+who+'</div><div class="txt">'+esc(m.text)+'</div></div></div>';
}
function post(m){
  m.time=clock();S.msgs.push(m);
  feed.insertAdjacentHTML('beforeend',msgHTML(m));scroll();
}
function typing(who){
  var p=P[who];
  var d=document.createElement('div');d.className='typing';d.id='typing';
  d.innerHTML='<div class="av mini" style="color:var('+p.c+')">AI</div><span>'+p.name+' 미니미가 생각 중</span><span class="dots"><span></span><span></span><span></span></span>';
  feed.appendChild(d);scroll();
}
function untyping(){var t=$('typing');if(t)t.remove()}
function addCard(html,cls){var d=document.createElement('div');d.className='card '+(cls||'');d.innerHTML=html;feed.appendChild(d);scroll();return d}

/* ---------- orchestrator panel ---------- */
function showScores(o,why,pick){
  var h='';
  ORDER.forEach(function(id){
    var v=o[id]||0,go=id===pick;
    h+='<div class="srow" style="--c:var('+P[id].c+')"><span>'+P[id].name+' AI</span><div class="bar"><i style="width:'+Math.round(v*100)+'%"></i></div><span class="n">'+v.toFixed(2)+'</span><span class="st'+(go?' go':'')+'">'+(go?'응답':'대기')+'</span></div>';
  });
  $('score').innerHTML=h;$('why').textContent=why||'';
}
function resetScores(){
  $('score').innerHTML=ORDER.map(function(id){return '<div class="srow" style="--c:var('+P[id].c+')"><span>'+P[id].name+' AI</span><div class="bar"><i style="width:0"></i></div><span class="n">0.00</span><span class="st">대기</span></div>'}).join('');
  $('why').textContent='새 메시지가 올라오면 누가 반응할지 점수로 보여줍니다. 임계값 0.6 이상 중 가장 높은 미니미가 발언합니다.';
}
function addLog(t){
  var li=document.createElement('li');li.innerHTML='<time>'+clock()+'</time><span>'+esc(t)+'</span>';
  var l=$('log');l.appendChild(li);l.scrollTop=l.scrollHeight;
}

/* ---------- scripted events ---------- */
function setStep(n){if(n>S.step||n!==S.step){S.step=Math.max(S.step,n)}renderStepper()}
function resultHTML(final){
  return '<div class="res"><h3>회의 결과</h3><p class="k">안건</p><h4>'+esc(AGENDA)+'</h4>'+
   '<p class="k">주요 의견</p><ul><li>일정 조율 문제를 해결하고 비동기 협업이 가능하다</li><li>AI끼리 자동으로 의견을 주고받는다</li><li>WebSocket은 FastAPI 기본 기능으로 구현 가능 (검색 확인)</li></ul>'+
   '<p class="k">의견 충돌</p><ul><li>AI의 자율 발언 범위</li><li>3일 안에 구현 가능한 난이도 (민수 우려 → 범위 축소로 해소)</li></ul>'+
   '<p class="k">결론</p><p>MVP는 사람 3 + 미니미 3, 채팅방 1개, 자리 비움 대리 참여 시연에 집중한다.</p>'+
   '<div class="final" id="finalbox">최종 결정 · 종원 <span class="pending">확정 대기</span></div></div>';
}
async function exec(ev,tok){
  var prev=S.step;
  if(ev.away==='ms'){S.away.ms=true;S.awayStart=S.msgs.length;}
  if(ev.t==='mini'){
    typing(ev.who);addLog(P[ev.who].name+' 미니미 응답 준비');
    await sleep(900/S.speed*1.1);if(tok!==S.tok)return;untyping();
    showScores(ev.o,ev.why,ev.who);
    post({kind:'mini',who:ev.who,text:ev.text,proxy:ev.proxy});
    addLog(P[ev.who].name+' 미니미 발언'+(ev.proxy?' (대리)':''));
  }else if(ev.t==='human'){
    post({kind:'human',who:ev.who,text:ev.text});
    if(ev.log)addLog(ev.log);
    if(ev.who==='jw')showScores({jw:.1,ms:.7,jh:.74},'종원의 안건 → 관련 있는 미니미를 고르는 중.',null);
    if(ev.final){var f=$('finalbox');if(f)f.innerHTML='최종 결정 · 종원 <span class="okc">확정</span>';addLog('최종 결정 확정')}
  }else if(ev.t==='sys'){
    sys(ev.text);
  }else if(ev.t==='tool'){
    typing('ms');await sleep(700/S.speed);if(tok!==S.tok)return;untyping();
    addCard('<h3>검색 에이전트</h3><p><b>'+esc(ev.q)+'</b></p><p>'+esc(ev.a)+'</p><p class="hint">출처: '+esc(ev.src)+' · 데모용 모의 결과</p>','toolcard');
    addLog(ev.log);
  }else if(ev.t==='result'){
    typing('jw');await sleep(800/S.speed);if(tok!==S.tok)return;untyping();
    addCard(resultHTML(),'res');addLog(ev.log);
  }else if(ev.t==='return'){
    var n=S.msgs.length-(S.awayStart==null?0:S.awayStart);
    S.away.ms=false;
    sys('민수가 돌아왔습니다.');
    addCard('<h3>민수에게 온 부재 요약</h3><p><b>부재 중 '+n+'개의 메시지가 오갔습니다.</b></p><ul><li>미니미가 민수의 기준(범위 축소, 근거 있는 일정)으로 의견을 전달했습니다.</li><li>검색 결과 FastAPI의 WebSocket 기본 지원이 확인되어 우려가 해소되었습니다.</li><li>결론: 사람 3 + 미니미 3, 채팅방 1개로 MVP 확정.</li></ul>','');
    addLog(ev.log);
  }
  if(ev.step)setStep(ev.step);
  renderPeople();
}
async function runFrom(single){
  if(S.busy)return;
  var tok=++S.tok;S.run=!single;S.busy=true;uiState();
  while(S.idx<SCRIPT.length&&tok===S.tok){
    var ev=SCRIPT[S.idx];S.idx++;
    await exec(ev,tok);
    if(tok!==S.tok)break;
    if(single)break;
    await sleep(750/S.speed);
  }
  if(tok===S.tok){S.run=false;S.busy=false;uiState()}
}
function uiState(){
  var done=S.idx>=SCRIPT.length;
  $('play').textContent=S.run?'일시정지':(done?'다시 재생':(S.idx>0?'이어서 재생':'데모 재생'));
  $('next').disabled=S.run||S.busy||done;
  $('send').disabled=S.run||S.busy;$('input').disabled=S.run||S.busy;
}
$('play').addEventListener('click',function(){
  if(S.run){S.tok++;S.run=false;S.busy=false;untyping();uiState();return}
  if(S.idx>=SCRIPT.length){reset(true);return}
  runFrom(false);
});
$('next').addEventListener('click',function(){runFrom(true)});
$('reset').addEventListener('click',function(){reset(false)});
function reset(autoplay){
  S.tok++;S.run=false;S.busy=false;S.idx=0;S.msgs=[];S.away={jw:false,ms:false,jh:false};S.step=4;S.awayStart=null;
  feed.innerHTML='';$('log').innerHTML='';
  intro();renderPeople();renderStepper();resetScores();uiState();
  if(autoplay)runFrom(false);
}
function intro(){
  sys('종원 · 민수 · 지현이 ‘AI 해커톤 팀방’에 입장했습니다.');
  sys('세 사람의 미니미도 함께 입장했습니다.');
  addLog('3명 가입, 미니미 3개 생성, 팀방 개설');addLog('사람 3 + 미니미 3 입장');
}
document.querySelectorAll('[data-speed]').forEach(function(b){b.addEventListener('click',function(){
  S.speed=1/parseFloat(b.dataset.speed);
  document.querySelectorAll('[data-speed]').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});
})});
/* speed: data-speed holds a delay multiplier; S.speed divides delays, so invert */

/* ---------- live round with Claude (sample capability) ---------- */
async function getSample(){
  if(S.sample!==undefined)return S.sample;
  try{
    if(window.claude&&window.claude.use){
      S.sample=await Promise.race([window.claude.use('sample'),sleep(4000).then(function(){return null})]);
    }else S.sample=null;
  }catch(e){S.sample=null}
  $('aiSrc').textContent=S.sample?'실시간 AI 응답 사용 가능':'오프라인 모의 응답';
  return S.sample;
}
function personaText(){
  return ORDER.map(function(id){
    var c=S.custom[id]||{},p=P[id];
    return id+' ('+p.name+', '+p.role+'): 말투='+(c.tone||p.tone)+' / 성향='+(c.traits||p.traits)+' / 상태='+(S.away[id]?'자리 비움(미니미가 대리 참여)':'참여 중');
  }).join('\n');
}
function history(){
  return S.msgs.slice(-14).map(function(m){return (P[m.who].name+(m.kind==='mini'?' 미니미':''))+': '+m.text}).join('\n');
}
function fallback(text,deleg){
  var away=S.away.ms;
  var out={replies:[
    {speaker:'jh',text:'"'+text+'" 방향이면 화면에서 바로 보이는지가 중요할 듯! 데모 장면으로 먼저 그려볼게.',scores:{jw:.3,ms:.5,jh:.86},why:'화면·데모 관련 → 지현 미니미 선택'},
    {speaker:'ms',text:(away?'민수가 자리를 비워서 대신 말할게. ':'')+'구현 범위가 늘지 않는지가 걱정이야. 핵심만 먼저 가면 가능할 듯.',scores:{jw:.25,ms:away?.94:.82,jh:.4},why:'구현 부담 우려 → 민수 미니미 선택'}
  ]};
  if(deleg)out.expanded='종원이 "'+text+'"라고 했어. 사용자 입장에서 얼마나 쉽게 이해되는지를 기준으로 보고 있고, 구현 가능한 범위인지도 같이 확인하자는 뜻이야.';
  return out;
}
async function liveRound(text,deleg){
  S.busy=true;uiState();
  if(!deleg){post({kind:'human',who:'jw',text:text});addLog('종원이 메시지 입력')}
  else{addLog('종원이 한 줄 전달, 미니미가 풀어서 작성')}
  showScores({jw:.1,ms:.1,jh:.1},'관련도를 계산하는 중...',null);
  typing('jw');
  var sample=await getSample(),res=null,live=false;
  if(sample){
    var prompt='당신은 회의 오케스트레이터입니다. 해커톤 팀방에 사람 3명(종원, 민수, 지현)과 각자의 AI 미니미가 있습니다.\n'+
     '[페르소나]\n'+personaText()+'\n[최근 대화]\n'+history()+'\n[새 입력] 종원: '+text+'\n'+
     (deleg?'종원은 한 줄만 말했습니다. 종원 미니미가 종원의 말투로 이 말을 2~3문장으로 풀어서 채팅방에 올립니다. 이것을 expanded에 넣으세요.\n':'')+
     '규칙: 관련도가 높은 미니미 최대 2개만 replies에 넣고, 각 미니미는 자기 페르소나 말투로 1~2문장, 한국어 구어체로 답합니다. 자리 비움인 사람의 미니미는 그 사람이 이전에 한 말을 근거로 대신 의견을 냅니다. speaker는 jw, ms, jh 중 하나. scores는 세 미니미의 관련도(0~1), why는 선택 이유 한 문장입니다.\n'+
     'JSON만 출력: {"expanded":"...","replies":[{"speaker":"jh","text":"...","scores":{"jw":0.2,"ms":0.5,"jh":0.9},"why":"..."}]}'+(deleg?'':' (expanded는 빈 문자열)');
    try{res=await sample.json(prompt,{modelTier:'quick',cache:false});live=true}catch(e){res=null}
  }
  if(!res||!res.replies||!res.replies.length){res=fallback(text,deleg);live=false}
  untyping();
  if(deleg){
    post({kind:'mini',who:'jw',text:res.expanded||fallback(text,true).expanded,chip:'한 줄 → 풀어쓰기'});
    addLog('종원 미니미가 풀어서 게시');
  }
  var list=res.replies.filter(function(r){return P[r.speaker]}).slice(0,2);
  for(var i=0;i<list.length;i++){
    var r=list[i];
    typing(r.speaker);await sleep(700);untyping();
    showScores(r.scores||{},r.why||'',r.speaker);
    post({kind:'mini',who:r.speaker,text:String(r.text||''),proxy:!!S.away[r.speaker],chip:live?null:'모의'});
    addLog(P[r.speaker].name+' 미니미 발언'+(S.away[r.speaker]?' (대리)':''));
    await sleep(300);
  }
  $('aiSrc').textContent=live?'실시간 AI 응답':'오프라인 모의 응답';
  S.busy=false;uiState();
}
function send(){
  var v=$('input').value.trim();if(!v||S.busy||S.run)return;
  $('input').value='';
  liveRound(v,S.mode==='deleg');
}
$('send').addEventListener('click',send);
$('input').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
function setMode(m){
  S.mode=m;$('mDirect').setAttribute('aria-pressed',m==='direct');$('mDeleg').setAttribute('aria-pressed',m==='deleg');
  $('modeHint').textContent=m==='direct'?'메시지를 보내면 미니미들이 관련도에 따라 반응합니다.':'한 줄만 적으면 종원 미니미가 말투에 맞게 풀어서 올립니다.';
  $('input').placeholder=m==='direct'?'안건이나 한 줄 의견을 입력하세요. 예: 가격은 무료로 가자':'짧게만 적어도 됩니다. 예: 범위 줄이자';
}
$('mDirect').addEventListener('click',function(){setMode('direct')});
$('mDeleg').addEventListener('click',function(){setMode('deleg')});

/* init */
S.speed=1;
intro();renderPeople();renderStepper();resetScores();uiState();getSample();
})();
</script>
